spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bwc_campaign}
    username: ${DB_USERNAME:bwc_app}
    password: ${DB_PASSWORD:bwc_app}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bayerwestphalian.campaign: DEBUG
