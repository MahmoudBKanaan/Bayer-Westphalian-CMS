<text x="82" y="1378" class="node-title">Production Requirements Notes</text>
<text x="84.0" y="1420" class="text">• HTTPS must be configured.</text>
<text x="84.0" y="1450" class="text">• CORS must be restricted.</text>
<text x="84.0" y="1480" class="text">• JWT/session secret must come from environment variables.</text>
<text x="827.3333333333334" y="1420" class="text">• Secrets must not be committed.</text>
<text x="827.3333333333334" y="1450" class="text">• Stack traces must be hidden in production.</text>
<text x="827.3333333333334" y="1480" class="text">• Real email/SMS provider must be configured or sending disabled.</text>
<text x="1570.6666666666667" y="1420" class="text">• Database backup and restore process must exist.</text>
<text x="1570.6666666666667" y="1450" class="text">• Smoke tests must pass before release.</text>
<text x="1570.6666666666667" y="1480" class="text">• Rollback plan must exist.</text>
