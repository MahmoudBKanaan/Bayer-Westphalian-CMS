spring:
  application:
    name: bayer-westphalian-campaign-platform
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.bayerwestphalian.campaign

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  contact:
    monthly-limit: ${CONTACT_MONTHLY_LIMIT:3}
    retry-limit: ${CONTACT_RETRY_LIMIT:3}
    uninterested-exclusion-days: ${UNINTERESTED_EXCLUSION_DAYS:90}
  providers:
    email:
      mode: ${EMAIL_PROVIDER_MODE:mock}
      smtp-host: ${SMTP_HOST:}
      smtp-port: ${SMTP_PORT:587}
      smtp-username: ${SMTP_USERNAME:}
      smtp-password: ${SMTP_PASSWORD:}
    sms:
      mode: ${SMS_PROVIDER_MODE:mock}
      api-key: ${SMS_API_KEY:}
    file-storage:
      mode: ${FILE_STORAGE_MODE:local}
      local-path: ${FILE_STORAGE_LOCAL_PATH:./data/files}
  security:
    jwt:
      issuer: ${JWT_ISSUER:bayer-westphalian-campaign-platform}
      secret: ${JWT_SECRET:dev-only-change-me}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    login-rate-limit:
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      failure-window-minutes: ${LOGIN_RATE_LIMIT_FAILURE_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES:15}
