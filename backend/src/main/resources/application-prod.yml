spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: true

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  # Item 539 / Sprint 16 critical 664: production must never expose stack traces or exception details.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.bayerwestphalian.campaign: ${LOG_LEVEL_APPLICATION:INFO}
    com.bayerwestphalian.campaign.schedule.ReminderProcessingScheduler: ${LOG_LEVEL_SCHEDULER:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    # Avoid verbose framework dumps that might be copied into ops tickets as "client" evidence.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN
  pattern:
    console: >-
      timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level
      service=${spring.application.name} requestId=%X{requestId:-none}
      schedulerRunId=%X{schedulerRunId:-none}
      thread=%thread logger=%logger{40} message=%msg%n%wEx

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace,consentEvidenceStorage
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

app:
  providers:
    real-sending-enabled: ${PROVIDER_REAL_SENDING_ENABLED:false}
    email:
      mode: ${EMAIL_PROVIDER_MODE:disabled}
      smtp-host: ${SMTP_HOST:}
      smtp-port: ${SMTP_PORT:587}
      smtp-username: ${SMTP_USERNAME:}
      smtp-password: ${SMTP_PASSWORD:}
    sms:
      mode: ${SMS_PROVIDER_MODE:disabled}
      api-key: ${SMS_API_KEY:}
    file-storage:
      mode: ${FILE_STORAGE_MODE:filesystem}
      local-path: ${FILE_STORAGE_LOCAL_PATH:/app/data/consent-evidence}
      max-bytes: ${FILE_STORAGE_MAX_BYTES:10485760}
  # Item 540: production CORS must be set via environment; no development-origin defaults.
  # Example: CORS_ALLOWED_ORIGINS=https://campaign.example.com,https://www.example.com
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    # Item 541: require HTTPS (or X-Forwarded-Proto: https from the reverse proxy).
    https:
      required: ${HTTPS_REQUIRED:true}
      hsts-enabled: ${HTTPS_HSTS_ENABLED:true}
      hsts-max-age-seconds: ${HTTPS_HSTS_MAX_AGE_SECONDS:31536000}
    jwt:
      secret: ${JWT_SECRET}
    login-rate-limit:
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      failure-window-minutes: ${LOGIN_RATE_LIMIT_FAILURE_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES:15}
