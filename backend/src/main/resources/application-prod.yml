spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    login-rate-limit:
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES}
      failure-window-minutes: ${LOGIN_RATE_LIMIT_FAILURE_WINDOW_MINUTES}
      lockout-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES}
